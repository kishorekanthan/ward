name: tag signature

# signature-test-* sits outside the v* tag ruleset, so test tags can be deleted after a run (#99).
on:
  push:
    tags: ["v*", "signature-test-*"]

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: verify-tag.mjs against main's allowed signers
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force --no-tags --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          node scripts/verify-tag.mjs "$TAG"

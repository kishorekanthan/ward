name: tag signature

# signature-test-* sits outside the v* tag ruleset, so test tags can be deleted after a run (#99).
on:
  push:
    tags: ["v*", "signature-test-*"]

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: git verify-tag against main's allowed signers
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags --depth=1 origin main
          git show FETCH_HEAD:.github/allowed_signers > "$RUNNER_TEMP/allowed_signers"
          git fetch --force --no-tags --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          git -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/allowed_signers" verify-tag "$TAG"
